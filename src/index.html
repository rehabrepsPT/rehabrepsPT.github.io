<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rehab Reps</title>
  <meta name="description" content="Our mission is to empower you by optimizing movement, restoring function, and promoting pain-free performance to freely participate in the activities you love." />
  
  <!-- Immediate theme preload to prevent flash -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('rr-theme');
      const theme = savedTheme || 'system';
      let isDark = false;
      
      if (theme === 'dark') {
        isDark = true;
      } else if (theme === 'system') {
        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      if (isDark) {
        document.documentElement.classList.add('dark');
      }
      
      // Add loading class to prevent flash
      document.documentElement.classList.add('theme-loading');
    })();
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/images/rr-logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/images/favicon-180.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/styles/main.css">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
</head>
<body class="bg-background-light">
  
  <!-- Loading overlay to prevent flash -->
  <div id="page-loading" class="page-loading"></div>
  
  <!-- Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <!-- Hero Section with Animation -->
  <section class="hero-section relative min-h-screen flex items-center justify-center overflow-hidden pt-24 md:pt-28 lg:pt-32">
    
    <!-- Animated Background Elements -->
    <div class="hero-bg-animation absolute inset-0 pointer-events-none">
      <!-- Geometric shapes -->
      <div class="geometric-shape shape-1 absolute"></div>
      <div class="geometric-shape shape-2 absolute"></div>
      <div class="geometric-shape shape-3 absolute"></div>
      
      <!-- Floating particles -->
      <div class="particles-container absolute inset-0">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>
      </div>
    </div>
    
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">
        
        <!-- Hero Content -->
        <div class="text-center lg:text-left">
          <div class="hero-content">
            <!-- Animated heading -->
            <h1 class="hero-title text-4xl sm:text-5xl lg:text-6xl font-extrabold text-rr-black mb-6 leading-tight">
              <span class="hero-word opacity-0" data-delay="500">Our</span>
              <span class="hero-word opacity-0 text-rr-yellow" data-delay="700">Mission</span>
            </h1>
            
            <!-- Animated mission statement -->
            <p class="hero-description text-lg lg:text-xl text-gray-700 mb-8 leading-relaxed max-w-2xl mx-auto lg:mx-0 opacity-0">
              is to empower you by optimizing movement, restoring function, and promoting pain-free performance to freely participate in the activities you love.
            </p>
            
            <!-- Rehabilitation Timeline -->
            <div class="rehabilitation-progress mb-8 opacity-0">
              <div class="max-w-2xl mx-auto lg:mx-0">
                
                <!-- Phase Labels -->
                <div class="phase-labels flex justify-between mb-3">
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">EVALUATE</span>
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">RECOVER</span>
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">REBUILD</span>
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">RELOAD</span>
                  <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">MAINTAIN</span>
                </div>
                
                <!-- Progress Bar Container -->
                <div class="progress-container relative mb-4">
                  <!-- Background track -->
                  <div class="progress-track bg-gray-200 h-2 rounded-full relative">
                    <!-- Progress fill -->
                    <div class="progress-fill bg-rr-yellow h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                    
                    <!-- Phase markers -->
                    <div class="phase-markers absolute inset-0 flex justify-between items-center px-1">
                      <div class="marker w-3 h-3 bg-white rounded-full border-2 border-gray-200 shadow-sm"></div>
                      <div class="marker w-3 h-3 bg-white rounded-full border-2 border-gray-200 shadow-sm"></div>
                      <div class="marker w-3 h-3 bg-white rounded-full border-2 border-gray-200 shadow-sm"></div>
                      <div class="marker w-3 h-3 bg-white rounded-full border-2 border-gray-200 shadow-sm"></div>
                      <div class="marker w-3 h-3 bg-white rounded-full border-2 border-gray-200 shadow-sm"></div>
                    </div>
                    
                    <!-- Active progress dot -->
                    <div class="progress-dot absolute top-1/2 transform -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-rr-yellow rounded-full border-3 border-white shadow-lg z-10 transition-all duration-1000 ease-out" style="left: 0%"></div>
                  </div>
                </div>
                
                <!-- Current Phase Display -->
                <div class="current-phase text-center">
                  <div class="phase-text text-lg font-semibold text-rr-black mb-1">EVALUATE</div>
                  <div class="phase-description text-sm text-gray-600">Comprehensive movement assessment</div>
                </div>
                
              </div>
            </div>
            
            <!-- CTA buttons -->
            <div class="hero-cta flex flex-col sm:flex-row gap-4 justify-center lg:justify-start opacity-0">
              <a href="/about.html" class="bg-rr-black text-white px-8 py-4 rounded-lg hover:bg-rr-yellow hover:text-rr-black transition-all duration-300 font-medium text-center">
                About Us
              </a>
              <a href="/contact.html" class="border-2 border-rr-black text-rr-black px-8 py-4 rounded-lg hover:bg-rr-black hover:text-white transition-all duration-300 font-medium text-center flex items-center justify-center">
                Get Started
                <svg class="ml-2 w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
        
        <!-- Hero Image Carousel -->
        <div class="hero-image-container relative opacity-0">
          <div class="carousel-container relative bg-white rounded-2xl shadow-2xl overflow-hidden h-[36rem] md:h-[36rem] lg:h-[36rem]">
            <div class="carousel-wrapper h-full">
              <div class="carousel-slide active h-full">
                <img src="/images/image01.png" alt="Physical therapy session 1" class="w-full h-full object-cover">
              </div>
              <div class="carousel-slide h-full">
                <img src="/images/image02.png" alt="Physical therapy session 2" class="w-full h-full object-cover">
              </div>
              <div class="carousel-slide h-full">
                <img src="/images/image03.png" alt="Physical therapy session 3" class="w-full h-full object-cover">
              </div>
              <div class="carousel-slide h-full">
                <img src="/images/image04.png" alt="Physical therapy session 4" class="w-full h-full object-cover">
              </div>
            </div>
            
            <!-- Carousel indicators -->
            <div class="carousel-indicators absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2">
              <button class="indicator active w-3 h-3 rounded-full bg-white/50" data-slide="0"></button>
              <button class="indicator w-3 h-3 rounded-full bg-white/50" data-slide="1"></button>
              <button class="indicator w-3 h-3 rounded-full bg-white/50" data-slide="2"></button>
              <button class="indicator w-3 h-3 rounded-full bg-white/50" data-slide="3"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script type="module" src="/scripts/main.ts"></script>
</body>
</html>
